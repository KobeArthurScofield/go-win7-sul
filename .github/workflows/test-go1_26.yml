name: Build patched Go 1.26 for tests

on:
  workflow_dispatch:
  schedule:
    - cron: '10 0 * * 6'
  push:
    branches:
      - build
    paths:
      - ".github/workflows/test-go1_26.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - build
    paths:
      - ".github/workflows/test-go1_26.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [windows]
        goarch: [amd64, 386]
        buildtarget: ['release-branch.go1.26']
      fail-fast: false
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - name: Show workflow information
        shell: pwsh
        run: |
          $assetName = "$env:GOOS-$env:GOARCH"
          Write-Output "GOOS: $env:GOOS, GOARCH: $env:GOARCH, APPLY-BRANCH: ${{ matrix.buildtarget }}"
          "ASSET_NAME=$assetName" >> $env:GITHUB_ENV

      - name: Download source
        uses: actions/checkout@v7
        with:
          repository: 'golang/go'
          ref: ${{ matrix.buildtarget }}
          path: 'go'

      - name: Download patch
        uses: actions/checkout@v7
        with:
          path: 'patch'

      # Patches for Go 1.26.x before more minor changes introduces.
      - name: Apply patch
        shell: pwsh
        run: |
          & .\patch\.github\scripts\windows-workflow.ps1 ApplyPatch go-1-26.diff

      - name: Set-up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go/src/go.mod'
          check-latest: true

      - name: Build patched Go
        shell: pwsh
        run: |
          Push-Location go/src
          try {
            & .\make.bat --no-banner
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ..\bin\go.exe tool dist banner
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally { Pop-Location }

      - name: Copy binaries into bin
        if: matrix.goos != 'linux' || matrix.goarch != 'amd64'
        shell: pwsh
        run: |
          & .\patch\.github\scripts\windows-workflow.ps1 PromoteBinaries

      - name: Upload package to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: go-for-win7-${{ env.ASSET_NAME }}
          path: |
            ./go/*

  source:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download source
        uses: actions/checkout@v7
        with:
          repository: 'golang/go'
          ref: 'release-branch.go1.26'
          path: 'go'

      - name: Download patch
        uses: actions/checkout@v7
        with:
          path: 'patch'

      - name: Apply patch
        shell: pwsh
        run: |
          & .\patch\.github\scripts\windows-workflow.ps1 ApplyPatch go-1-26.diff

      - name: Upload package to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: go-for-win7-source
          path: |
            ./go/*

  legacy:
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      matrix:
        buildtarget: ['release-branch.go1.26']
      fail-fast: false
    steps:
      - name: Download source
        uses: actions/checkout@v7
        with:
          repository: 'golang/go'
          ref: ${{ matrix.buildtarget }}
          path: 'go'

      - name: Download patch
        uses: actions/checkout@v7
        with:
          path: 'patch'

      - name: Apply patch
        shell: pwsh
        run: |
          & .\patch\.github\scripts\windows-workflow.ps1 ApplyPatch go-1-26.diff legacy-1-26.diff

      - name: Upload package to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: source-legacy
          path: |
            ./go/*
