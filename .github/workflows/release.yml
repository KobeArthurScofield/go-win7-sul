name: Build patched Go and release

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - build
    paths:
      - ".github/workflows/release.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/release.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
        buildtarget: ['go1.27.1']
      fail-fast: false
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - name: Show workflow information
        shell: pwsh
        run: |
          $assetName = "$env:GOOS-$env:GOARCH"
          Write-Output "GOOS: $env:GOOS, GOARCH: $env:GOARCH, GOVER: ${{ matrix.buildtarget }}"
          "ASSET_NAME=$assetName" >> $env:GITHUB_ENV

      - name: Download source
        uses: actions/checkout@v7
        with:
          repository: 'golang/go'
          ref: ${{ matrix.buildtarget }}
          path: 'go'

      - name: Download patch
        uses: actions/checkout@v7
        with:
          path: 'patch'

      # Patches for Go 1.27.x before more minor changes introduces.
      - name: Apply patch
        shell: pwsh
        run: |
          & .\patch\.github\scripts\windows-workflow.ps1 ApplyPatch go-1-27.diff

      - name: Set-up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go/src/go.mod'
          check-latest: true

      - name: Build patched Go
        shell: pwsh
        run: |
          Push-Location go/src
          try {
            & .\make.bat --no-banner
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ..\bin\go.exe tool dist banner
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally { Pop-Location }

      - name: Copy binaries into bin
        if: matrix.goos != 'linux' || matrix.goarch != 'amd64'
        shell: pwsh
        run: |
          & .\patch\.github\scripts\windows-workflow.ps1 PromoteBinaries

      - name: Copy License
        shell: pwsh
        run: |
          & .\patch\.github\scripts\windows-workflow.ps1 CopyLicense

      - name: Upload package to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: go-for-win7-${{ env.ASSET_NAME }}
          path: |
            ./go/*

      - name: create ZIP archive
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          & .\patch\.github\scripts\windows-workflow.ps1 CreateZip "go-for-win7-${{ env.ASSET_NAME }}.zip"

      - name: Compute hashes for file
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          & .\patch\.github\scripts\windows-workflow.ps1 ComputeHashes "go-for-win7-${{ env.ASSET_NAME }}.zip"

      - name: Upload packages to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./go/go-for-win7-${{ env.ASSET_NAME }}.zip*
          tag: ${{ github.ref }}
          file_glob: true
