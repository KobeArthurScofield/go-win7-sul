name: Build archived source

on:
  workflow_dispatch:

jobs:
  format-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Format new release
        uses: andelf/nightly-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: 'archive'
          name: "Archived source code packages"
          body: |
            For
            - Windows Server 2008 R2
            - Windows 7
            - Windows Server 2012
            - Windows Server 2012 R2
            - Windows 8.1
          prerelease: true

  build:
    runs-on: windows-latest
    needs: format-release
    permissions:
      contents: write
    strategy:
      matrix:
        buildtarget: ['21', '22', '23', '24', '25']
      fail-fast: false
    steps:
      - name: Show workflow information
        shell: pwsh
        run: |
          $assetName = "go-win7-win6-1.${{ matrix.buildtarget }}"
          Write-Output "SOURCE PACKET GOVER: 1.${{ matrix.buildtarget }}"
          "ASSET_NAME=$assetName" >> $env:GITHUB_ENV

      - name: Download source
        uses: actions/checkout@v7
        with:
          repository: 'golang/go'
          ref: 'release-branch.go1.${{ matrix.buildtarget }}'
          path: 'go'

      - name: Download patch
        uses: actions/checkout@v7
        with:
          path: 'patch'

      - name: Apply patch
        shell: pwsh
        run: |
          & .\patch\.github\scripts\windows-workflow.ps1 ApplyPatch go-1-${{ matrix.buildtarget }}.diff

      - name: Copy License
        shell: pwsh
        run: |
          & .\patch\.github\scripts\windows-workflow.ps1 CopyLicense

      - name: Upload package to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: |
            ./go/*

      - name: create ZIP archive
        shell: pwsh
        run: |
          & .\patch\.github\scripts\windows-workflow.ps1 CreateZip "${{ env.ASSET_NAME }}.zip"

      - name: Compute hashes for file
        shell: pwsh
        run: |
          & .\patch\.github\scripts\windows-workflow.ps1 ComputeHashes "${{ env.ASSET_NAME }}.zip"

      - name: Upload packages to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./go/${{ env.ASSET_NAME }}.zip*
          tag: archive
          file_glob: true

  legacy:
    runs-on: windows-latest
    needs: format-release
    permissions:
      contents: write
    strategy:
      matrix:
        buildtarget: ['21', '22', '23', '24', '25', '26']
      fail-fast: false
    steps:
      - name: Show workflow information
        shell: pwsh
        run: |
          $assetName = "go-win7-win6-1.${{ matrix.buildtarget }}-legacy"
          Write-Output "SOURCE PACKET GOVER: 1.${{ matrix.buildtarget }}"
          "ASSET_NAME=$assetName" >> $env:GITHUB_ENV

      - name: Download source
        uses: actions/checkout@v7
        with:
          repository: 'golang/go'
          ref: 'release-branch.go1.${{ matrix.buildtarget }}'
          path: 'go'

      - name: Download patch
        uses: actions/checkout@v7
        with:
          path: 'patch'

      - name: Apply patch
        shell: pwsh
        run: |
          & .\patch\.github\scripts\windows-workflow.ps1 ApplyPatch go-1-${{ matrix.buildtarget }}.diff legacy-1-${{ matrix.buildtarget }}.diff

      - name: Copy License
        shell: pwsh
        run: |
          & .\patch\.github\scripts\windows-workflow.ps1 CopyLicense

      - name: Upload package to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: |
            ./go/*

      - name: create ZIP archive
        shell: pwsh
        run: |
          & .\patch\.github\scripts\windows-workflow.ps1 CreateZip "${{ env.ASSET_NAME }}.zip"

      - name: Compute hashes for file
        shell: pwsh
        run: |
          & .\patch\.github\scripts\windows-workflow.ps1 ComputeHashes "${{ env.ASSET_NAME }}.zip"

      - name: Upload packages to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./go/${{ env.ASSET_NAME }}.zip*
          tag: archive
          file_glob: true
